# defaults 对每只票生效(票型无关);单票 rules 为追加(箱体等需人工知识的规则)
defaults:
  rules:
    - rule: b1
      params: {no_good: true}    # 盯盘口径:仅 J≤15
    - rule: weekly_b1
      params: {no_good: true}
    - rule: near_ma
      params: {period: 120, tolerance: 0.02}
    - rule: near_ma
      params: {period: 250, tolerance: 0.02}
    - rule: near_ma
      params: {period: 360, tolerance: 0.02}

